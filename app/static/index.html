<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B-Roll Hunter</title>
<link rel="manifest" href="/static/manifest.json"><meta name="theme-color" content="#111827">
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ac:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px;max-width:720px;margin:auto}
h1{font-size:22px}.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
input,textarea,button{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:var(--tx);margin-top:8px}
button{background:var(--ac);color:#052e16;font-weight:700;border:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#334155;padding:6px 10px;border-radius:99px;font-size:14px;cursor:pointer}
pre{white-space:pre-wrap;font-size:12px;color:var(--mut);max-height:260px;overflow:auto}
small{color:var(--mut)}table{width:100%;font-size:14px;border-collapse:collapse}td{padding:4px;border-bottom:1px solid #334155}
</style></head><body>
<h1>🎬 B-Roll Hunter</h1>
<div class="card">
  <label>Tema</label><input id="theme" placeholder="ex: diabetes">
  <div class="chips" id="chips"></div>
  <label style="display:block;margin-top:12px">Clipes por subcategoria</label><input id="per" type="number" value="5" min="1" max="30">
  <label style="display:block;margin-top:12px">Links extras (TikTok/Instagram/YouTube), um por linha — opcional</label>
  <textarea id="urls" rows="3"></textarea>
  <button onclick="go()">Baixar B-rolls</button>
</div>
<div class="card"><b>Tarefas</b><div id="jobs"></div></div>
<div class="card"><b>Biblioteca</b><div id="lib"></div></div>
<script>
let T=localStorage.getItem('tk')||'';
async function api(p,o={}){o.headers={...(o.headers||{}),'X-Token':T,'Content-Type':'application/json'};
 const r=await fetch(p,o); if(r.status==401){T=prompt('Senha do app:')||'';localStorage.setItem('tk',T);return api(p,o)} return r.json()}
async function themes(){const t=await api('/api/themes');chips.innerHTML=Object.keys(t).map(k=>`<span class=chip onclick="theme.value='${k}'">${k}</span>`).join('')}
async function go(){if(!theme.value.trim())return;await api('/api/jobs',{method:'POST',body:JSON.stringify({theme:theme.value,per_sub:+per.value,urls:urls.value.split('\n')})});urls.value='';refresh()}
async function refresh(){const j=await api('/api/jobs');
 jobs.innerHTML=j.map(x=>`<p><b>${x.theme}</b> — ${x.status} — ${x.clips_saved} clipes<br><small>${x.subs.join(', ')}</small></p><pre>${x.logs.join('\n')}</pre>`).join('')||'<small>nenhuma</small>';
 const c=await api('/api/catalog');const g={};c.clips.forEach(k=>{const n=k.theme+' / '+k.subcategory;g[n]=(g[n]||0)+1});
 lib.innerHTML='<table>'+Object.entries(g).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')+`</table><small>${c.clips.length} clipes no total</small>`}
themes();refresh();setInterval(refresh,5000);
</script></body></html>
